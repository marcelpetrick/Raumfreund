# Serves the download page and the APK (unprivileged nginx, port 8080).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    types {
        text/html html;
        text/plain txt;
        application/vnd.android.package-archive apk;
        application/octet-stream aab;
    }
    default_type text/plain;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff always;
    }
}
