#
# Pure-Dart tool package: package:lints recommended set plus the same strict
# language modes as the app (flutter_lints is not available here).
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_catches_without_on_clauses
    - avoid_dynamic_calls
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - public_member_api_docs
    - require_trailing_commas
    - unawaited_futures
