#
# Shared job setup: pinned JDK, cached pinned Flutter SDK (.flutter-version),
# pub cache (pubspec.lock) and Gradle caches (wrapper + lock/build files).
name: Setup Raumfreund toolchain
description: JDK, cached Flutter SDK, pub and Gradle caches
runs:
  using: composite
  steps:
    - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: "21.0.12+101" # SemVer form of Temurin 21.0.12.1+1 (Adoptium API)
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "24.21.0"
    - name: Cache pinned Flutter SDK
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .toolchain/flutter
        key: flutter-${{ runner.os }}-${{ hashFiles('.flutter-version') }}
    - name: Cache pub packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.pub-cache
        key: pub-${{ runner.os }}-${{ hashFiles('.flutter-version', '**/pubspec.lock') }}
    - name: Cache Gradle
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: >-
          gradle-${{ runner.os }}-${{
            hashFiles('.flutter-version', 'android/gradle/wrapper/gradle-wrapper.properties',
            'android/**/*.gradle.kts', 'pubspec.lock')
          }}
