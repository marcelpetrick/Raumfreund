#
# CI mirrors ./localPipeline.sh: every job only selects pipeline steps with
# --only. Change the gate in localPipeline.sh, never the command lists here.
# Actions are pinned to full commit SHAs (version in the trailing comment).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Format, lint, static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Static checks
        run: >-
          ./localPipeline.sh --only
          toolchain,tools,deps,format,analyze,fnlen,shell,python,tooltests,docs,licenses,yaml,secrets,vulns,kotlin
      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-logs
          path: reports/pipeline
          retention-days: 14
          if-no-files-found: ignore

  test:
    name: Unit, widget and golden tests with coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Tests and coverage gate
        run: ./localPipeline.sh --only toolchain,deps,test,coverage
      - name: Upload coverage and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            reports/pipeline
            coverage/lcov.info
          retention-days: 14
          if-no-files-found: ignore

  android:
    name: Android debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Build debug APK and check privacy gate
        run: ./localPipeline.sh --only toolchain,deps,native,apk,privacy
      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raumfreund-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-logs
          path: reports/pipeline
          retention-days: 14
          if-no-files-found: ignore
