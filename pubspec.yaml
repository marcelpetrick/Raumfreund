name: raumfreund
description: "Kindgerechte Lautstärkeampel für gemeinsame Räume."
publish_to: 'none'

# Semantic version + monotonic Android versionCode. Never edit by hand:
# use tool/bump_version.sh (see AGENTS.md).
version: 0.6.26+71

environment:
  sdk: 3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Exact pin required by flutter_localizations in the pinned Flutter SDK.
  intl: 0.20.3
  shared_preferences: 2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/licenses/
