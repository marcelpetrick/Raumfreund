#
# yamllint configuration (version pinned in tool/requirements-dev.in).
# Run: .toolchain/venv/bin/yamllint --strict .
extends: default

ignore: |
  .toolchain/
  build/
  **/build/
  **/.dart_tool/
  **/node_modules/
  # Generated by pub/npm; not hand-written.
  pubspec.lock
  **/pubspec.lock

rules:
  # GitHub workflows and pubspecs are plain YAML files without "---".
  document-start: disable
  # Long run: commands, URLs and action SHA pins do not wrap well.
  line-length:
    max: 160
  # GitHub Actions' trigger key is `on`; it must not be flagged as a boolean.
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  # SHA-pinned actions are commonly annotated with a single space before the
  # version comment ("uses: owner/action@<sha> # v5"); accept that style.
  comments:
    min-spaces-from-content: 1
