#
# Lint profile: flutter_lints (recommended set) plus a curated set of stricter
# rules. Rules that contradict each other (e.g. always_specify_types vs.
# omit_local_variable_types) are deliberately not combined; the chosen profile
# is documented in docs/toolchain.md.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error
  exclude:
    - build/**
    - android/**
    - .toolchain/**
    - lib/l10n/generated/**

linter:
  rules:
    - always_declare_return_types
    - avoid_catches_without_on_clauses
    - avoid_dynamic_calls
    - avoid_empty_else
    - avoid_redundant_argument_values
    - avoid_slow_async_io
    - avoid_type_to_string
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    - comment_references
    - directives_ordering
    - discarded_futures
    - empty_catches
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - no_runtimeType_toString
    - only_throw_errors
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - public_member_api_docs
    - require_trailing_commas
    - sort_constructors_first
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - unnecessary_statements
    - use_build_context_synchronously
    - use_named_constants
    - use_super_parameters
